name: 자동차 판매량 갱신

on:
  schedule:
    # 월간 발표 시점 차이를 고려해 매월 8·15·22일 오전 10:20(KST)에 확인합니다.
    - cron: '20 1 8,15,22 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-car-sales.mjs'
      - 'scripts/fetch-car-rankings.mjs'
      - 'scripts/fetch-used-car-sales.mjs'
      - '.github/workflows/update-car-sales.yml'

permissions:
  contents: write

concurrency:
  group: update-car-sales
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 신차 월별 판매량 수집
        run: node scripts/fetch-car-sales.mjs
        continue-on-error: true

      - name: 신차 브랜드·모델 순위 수집
        run: node scripts/fetch-car-rankings.mjs
        continue-on-error: true

      - name: 중고차 거래량·모델 순위 수집
        run: node scripts/fetch-used-car-sales.mjs
        continue-on-error: true

      - name: 검색용 정적 HTML 생성
        run: node scripts/build-static.mjs

      - name: 생성 결과 검증
        run: node scripts/build-static.mjs --check

      - name: 배포 allowlist 산출물 검증
        run: |
          node scripts/build-deploy.mjs
          node scripts/build-deploy.mjs --check

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/car-sales.json data/car-rankings.json data/used-car-sales.json car.html car/domestic.html car/imported.html car/used.html used-car.html used-car/domestic.html used-car/imported.html sitemap.xml _headers
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 자동차 판매량 월간 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git pull --rebase origin main
            git push
          fi
