name: 실험 - 핫딜 매칭

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 네이버 API 진단
        run: node scripts/diag-naver.mjs
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
