name: 부동산 실거래가 갱신

on:
  schedule:
    # ⚠️ 8월 한정 긴축: 주 1회 수요일 21:30 UTC = 목요일 06:30 KST.
    # (원래 매일 1회. 이 워크플로가 8/4·6·7·8 나흘 360분씩 행 걸려 월 한도의 76%를 소진.
    #  실거래 신고는 계약 후 30일 이내라 주 1회도 데이터 품질에 큰 손실 없음.
    #  9월 리셋 후 또는 저장소 public 전환 시 '30 21 * * *'(매일)로 복구할 것.)
    - cron: '30 21 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-realestate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # ★ 이 한 줄이 없어서 행 걸린 잡 4개가 기본 타임아웃 360분씩(총 1,440분) 태웠음.
    #   평상시 ~8분 실측이므로 20분이면 충분한 상한.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 실거래가 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-realestate.mjs

      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 시세 워크플로와 동시에 돌 수 있으므로 pull --rebase 후 push 합니다.
          git add data/realestate.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 부동산 실거래가 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git pull --rebase origin main
            git push
          fi
