name: 부동산 실거래가 갱신

on:
  schedule:
    # 매일 21:30 UTC = 한국시간 06:30. 실거래 신고는 30일 이내라 하루 1회면 충분하고,
    # 매시간 돌리면 256 시군구 × 3개월 × 24회 = 18,000콜을 넘어 일일 한도(10,000)를 초과합니다.
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-realestate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 실거래가 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-realestate.mjs

      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 시세 워크플로와 동시에 돌 수 있으므로 pull --rebase 후 push 합니다.
          git add data/realestate.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 부동산 실거래가 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git pull --rebase origin main
            git push
          fi
