name: 시세 데이터 갱신

on:
  schedule:
    # 매시 정각 (UTC) — 한국시간 매시 정각.
    # 저장소가 public 이라 Actions 분은 무료입니다. private 로 되돌리면
    # 무료 한도(2,000분/월)가 적용되니 크론 축소를 함께 검토하세요.
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-data.yml']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 행(hang) 시 기본 타임아웃 360분을 태우지 않도록 상한 (평상시 ~1.4분, 최대 5.8분 실측)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 로또 데이터 수집
        run: node scripts/fetch-lotto.mjs
        continue-on-error: true

      - name: 시장 시세 수집
        run: node scripts/fetch-markets.mjs
        continue-on-error: true

      - name: 백화점 상품권 시세 수집
        run: node scripts/fetch-giftcards-dept.mjs
        continue-on-error: true

      - name: 국내 금리 수집 (한국은행 ECOS)
        run: node scripts/fetch-rates.mjs
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        continue-on-error: true

      - name: 주유소 기름값 수집 (오피넷)
        run: node scripts/fetch-oil.mjs
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
        continue-on-error: true

      # 네이버 쇼핑 검색 API가 2026-08 종료(SE05)되어 가격비교 수집을 중단합니다.
      # fetch-shopping.mjs / shopping.html 은 대체 소스 확보 시 복구용으로 남겨둡니다.

      - name: 핫딜 수집 (커뮤니티 RSS)
        run: node scripts/fetch-hotdeals.mjs
        continue-on-error: true

      - name: 관련 뉴스 수집
        run: node scripts/fetch-news.mjs
        continue-on-error: true

      - name: RSS 피드 생성
        run: node scripts/build-rss.mjs
        continue-on-error: true

      - name: 검색용 정적 HTML 생성
        run: node scripts/build-static.mjs

      - name: 생성 결과 검증
        run: node scripts/build-static.mjs --check

      - name: 보안 회귀 테스트
        run: node --test scripts/security-sanitizers.test.mjs scripts/giftcard-faq.test.mjs functions/api/lotto/security.test.mjs functions/security-routes.test.mjs

      - name: 배포 allowlist 산출물 검증
        run: |
          node scripts/build-deploy.mjs
          node scripts/build-deploy.mjs --check

      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ _headers rss.xml sitemap.xml index.html coin.html stock.html kosdaq.html fx.html metal.html energy.html macro.html giftcard.html giftcard/lotte.html giftcard/shinsegae.html giftcard/hyundai.html hotdeal.html realestate.html lotto.html shopping.html about.html
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 시세 데이터 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            # 부동산 워크플로와 동시에 돌 수 있으므로 rebase 후 push 합니다.
            git pull --rebase origin main
            git push
          fi
