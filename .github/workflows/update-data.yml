name: 시세 데이터 갱신

on:
  schedule:
    # 매시 정각 (UTC) — 한국시간 매시 정각
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-data.yml']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 로또 데이터 수집
        run: node scripts/fetch-lotto.mjs
        continue-on-error: true

      - name: 시장 시세 수집
        run: node scripts/fetch-markets.mjs
        continue-on-error: true

      - name: 백화점 상품권 시세 수집
        run: node scripts/fetch-giftcards-dept.mjs
        continue-on-error: true

      - name: 관련 뉴스 수집
        run: node scripts/fetch-news.mjs
        continue-on-error: true

      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 시세 데이터 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            # 부동산 워크플로와 동시에 돌 수 있으므로 rebase 후 push 합니다.
            git pull --rebase origin main
            git push
          fi
