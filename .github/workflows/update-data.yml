name: 시세 데이터 갱신

on:
  schedule:
    # ⚠️ 8월 한정 긴축: 하루 3회 (KST 09:00 / 14:00 / 19:00).
    # Actions 무료 한도(2,000분/월)를 행 걸린 잡 4개가 76% 태워 잔여가 ~116분뿐.
    # 9월 리셋 후 또는 저장소 public 전환 시 '0 * * * *'(매시간)으로 복구할 것.
    - cron: '0 0,5,10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-data.yml']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 행(hang) 시 기본 타임아웃 360분을 태우지 않도록 상한 (평상시 ~1.4분, 최대 5.8분 실측)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 로또 데이터 수집
        run: node scripts/fetch-lotto.mjs
        continue-on-error: true

      - name: 시장 시세 수집
        run: node scripts/fetch-markets.mjs
        continue-on-error: true

      - name: 백화점 상품권 시세 수집
        run: node scripts/fetch-giftcards-dept.mjs
        continue-on-error: true

      - name: 국내 금리 수집 (한국은행 ECOS)
        run: node scripts/fetch-rates.mjs
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        continue-on-error: true

      - name: 주유소 기름값 수집 (오피넷)
        run: node scripts/fetch-oil.mjs
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
        continue-on-error: true

      # 네이버 쇼핑 검색 API가 2026-08 종료(SE05)되어 가격비교 수집을 중단합니다.
      # fetch-shopping.mjs / shopping.html 은 대체 소스 확보 시 복구용으로 남겨둡니다.

      - name: 핫딜 수집 (커뮤니티 RSS)
        run: node scripts/fetch-hotdeals.mjs
        continue-on-error: true

      - name: 관련 뉴스 수집
        run: node scripts/fetch-news.mjs
        continue-on-error: true

      - name: RSS 피드 생성
        run: node scripts/build-rss.mjs
        continue-on-error: true

      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ rss.xml
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 시세 데이터 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            # 부동산 워크플로와 동시에 돌 수 있으므로 rebase 후 push 합니다.
            git pull --rebase origin main
            git push
          fi
